services:
  - type: web
    name: hostelcode-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      # Uncomment if using Render Persistent Disks:
      # - key: DATA_DIR
      #   value: /var/data
    # If upgrading to a paid instance with a persistent disk, uncomment below:
    # disk:
    #   name: hostelcode-data
    #   mountPath: /var/data
    #   sizeGB: 1

